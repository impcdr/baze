<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Baze UI showcase</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Baze is the shelf. Apps sit on it." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      try {
        if (localStorage.getItem('kiln.theme.v2') !== 'light') {
          localStorage.setItem('kiln.theme', 'light');
          localStorage.setItem('kiln.theme.v2', 'light');
        }
        document.documentElement.classList.toggle('dark', localStorage.getItem('kiln.theme') === 'dark');
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@800&family=Red+Hat+Text:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
