@if (home(); as home) {
  <section class="bg-card flex flex-col gap-5 rounded-xl px-6 py-8 sm:px-10" data-testid="home-hero">
    <p class="text-muted-foreground text-base">{{ home.greeting }}</p>
    <h1 class="font-display text-4xl tracking-tight">{{ home.headline }}</h1>
    <form class="bg-background flex flex-wrap items-center gap-3 rounded-xl border-2 p-2 ps-5" (submit)="$event.preventDefault(); make()">
      <label class="sr-only" for="home-prompt">Describe your app</label>
      <input
        id="home-prompt"
        name="prompt"
        class="min-w-0 flex-1 bg-transparent py-3 text-lg outline-none"
        [value]="prompt()"
        (input)="type($any($event.target).value)"
      />
      <button hlmBtn type="submit" size="lg" [disabled]="sending()">
        Make it
        <ng-icon name="lucideArrowRight" />
      </button>
    </form>
    <div class="flex flex-wrap items-center gap-2">
      <span class="text-muted-foreground me-1 text-sm">{{ home.suggestionsLabel }}</span>
      @for (idea of home.suggestions; track idea.id) {
        <button hlmBtn type="button" variant="outline" size="sm" (click)="useSuggestion(idea.prompt)">{{ idea.label }}</button>
      }
    </div>
  </section>

  <section class="flex flex-col gap-4" data-testid="home-shelf">
    <div class="flex items-baseline justify-between gap-3">
      <h2 class="font-display text-2xl">{{ home.shelfTitle }}</h2>
      <a routerLink="/apps" class="text-sm font-bold">{{ home.seeAllLabel }}</a>
    </div>
    <div class="grid grid-cols-[repeat(auto-fill,minmax(300px,1fr))] gap-4">
      @for (app of home.featured; track app.id) {
        <bz-app-card [app]="app" (removed)="reload()" />
      }
    </div>
  </section>
}
